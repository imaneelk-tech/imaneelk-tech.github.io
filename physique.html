<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liens Physique-Chimie</title>
  <style>
    body {
      font-family: "Poppins", Arial, sans-serif;
      text-align: center;
      padding-top: 60px;
      background: linear-gradient(135deg, #c2e9fb, #a1c4fd);
      min-height: 100vh;
      margin: 0;
    }

    h1 {
      color: #222;
      font-size: 2em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1em;
      color: #333;
      margin-bottom: 40px;
    }

    .link-btn {
      display: block;
      margin: 15px auto;
      padding: 15px 25px;
      width: 280px;
      text-decoration: none;
      color: white;
      background: linear-gradient(90deg, #4f86f7, #7f53ac);
      border-radius: 12px;
      font-size: 1.1em;
      font-weight: 600;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
    }

    .link-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.25);
      background: linear-gradient(90deg, #7f53ac, #4f86f7);
    }

    footer {
      margin-top: 50px;
      color: #333;
      font-size: 0.9em;
    }

    .emoji {
      font-size: 1.3em;
      margin-right: 6px;
    }
